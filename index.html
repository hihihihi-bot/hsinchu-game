<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瘋狗九降風！我的時空機耗能才沒那麼高勒</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; display: flex; overflow: hidden; background-color: #1a1a1a; }
        
        /* 左側遊戲控制面板 */
        #panel {
            width: 400px; height: 100%; background: #2c3e50; color: #ecf0f1;
            padding: 20px; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000; overflow-y: auto; flex-shrink: 0;
        }
        h1 { font-size: 22px; color: #f1c40f; text-align: center; margin-top: 0; border-bottom: 2px solid #f1c40f; padding-bottom: 10px; }
        
        /* 景點真實相片顯示框（升級：加入更漂亮的陰影與漸層外框） */
        #photo-box {
            width: 100%; height: 180px; background: #222; border: 3px solid #f1c40f;
            border-radius: 8px; margin-bottom: 15px; background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8); box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: background-image 0.5s ease-in-out;
        }
        
        .status-box { background: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .stamina-bar { width: 100%; background: #7f8c8d; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        #stamina-fill { width: 100%; background: #2ecc71; height: 100%; transition: width 0.3s; }
        
        #display-area { flex-grow: 1; background: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 15px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
        .event-log { color: #e67e22; font-weight: bold; margin-top: 10px; border-top: 1px dashed #7f8c8d; padding-top: 5px; }
        .story-text { color: #f39c12; font-weight: bold; font-size: 16px; }
        #inventory { font-weight: bold; color: #1abc9c; }
        
        /* 右側真實地圖區塊（完全釋放寬度高，呈現全螢幕地圖） */
        #map { flex-grow: 1; height: 100%; background: #e5e3df; }
        
        /* 🔴 真實地圖專屬：特製 CSS 大頭針樣式（取代預設藍色水滴） */
        .custom-pin { background-color: #3498db; border: 3px solid #fff; border-radius: 50%; width: 24px !important; height: 24px !important; box-shadow: 0 3px 6px rgba(0,0,0,0.4); cursor: pointer; transition: all 0.2s; }
        .custom-pin-visited { background-color: #2ecc71; opacity: 0.6; }
        .custom-pin-current { background-color: #e74c3c; border-color: #f1c40f; width: 32px !important; height: 32px !important; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.7); animation: bounce 0.5s infinite alternate; }
        
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

        /* 遊戲結束滿版彈窗 */
        #overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;
            color: white; text-align: center; flex-direction: column;
        }
        #overlay h2 { font-size: 40px; color: #f1c40f; }
        #overlay button { padding: 10px 20px; font-size: 18px; margin-top: 20px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="panel">
        <h1>瘋狗九降風！<br><span style="font-size:14px; color:#bdc3c7;">我的時空機耗能才沒那麼高勒</span></h1>
        
        <div id="photo-box">📷 點擊地圖標記開啟時空相機...</div>

        <div class="status-box">
            <div>⚡ 體力值：<span id="stamina-text">100</span> / 100</div>
            <div class="stamina-bar"><div id="stamina-fill"></div></div>
        </div>
        <div class="status-box">
            <div>🎒 已收集物資 (<span id="count-text">0</span>/5)：</div>
            <div id="inventory">空空如也</div>
        </div>
        <div id="display-area">
            <p class="story-text">【真實地圖連線成功】</p>
            <p id="story-box">時空盒子成功破解網絡防護，已讀取新竹舊城區真實圖資！<b>請直接用滑鼠點擊右側地圖上的標記藍點</b>。出發收集物資回到現代吧！</p>
            <div id="event-box"></div>
        </div>
    </div>

    <div id="map"></div>

    <div id="overlay">
        <h2 id="end-title">遊戲結束</h2>
        <p id="end-desc" style="max-width: 600px; font-size: 18px; line-height: 1.6; padding: 0 20px;"></p>
        <button onclick="window.location.reload()">重新時空穿越</button>
    </div>

    <script>
        // ==================== 100% 真實經緯度、故事與網路高清相片數據 ====================
        const LOCATIONS = {
            "1": { 
                name: "東門城（迎曦門）", coords: [24.8039, 120.9714], item: "竹塹城磚磚塊", desc: "剛落成不久的宏偉石磚城門，燕尾屋脊直刺天際。", 
                story: "道光九年（1829年）正是竹塹石城宣告完工的年份！你眼前的這座城門剛蓋好，石牌上的「迎曦」二字墨跡彷彿才剛乾。過去這裡只有木柵欄，現在終於換成了堅固的磚石城牆！",
                img: "https://images.unsplash.com/photo-1571474004502-c1def214ac6d?auto=format&fit=crop&w=600&q=80" // 宏偉古城牆意境照
            },
            "2": { 
                name: "新竹都城隍廟", coords: [24.8026, 120.9659], item: "道光年間貢丸湯", desc: "香火鼎盛，攤販雲集，瀰漫著令人垂涎的香氣。", 
                story: "此時的城隍廟已經是竹塹城的信仰中心。廟前擠滿了感謝神明庇佑的香客，旁邊賣著用木棍純手工搥打、彈性十足的清代貢丸湯。",
                img: "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=600&q=80" // 廟宇香火意境照
            },
            "3": { 
                name: "北門大街", coords: [24.8055, 120.9645], item: "老字號漢方藥材", desc: "竹塹城最繁華的商業街，商賈往來絡繹不絕。", 
                story: "這條街是通往舊港的必經之路。因為剛蓋好城牆，北門大街的店面地價飛漲，可以說是全台灣當時最頂級的「黃金店面一條街」。",
                img: "https://images.unsplash.com/photo-1605810230434-7631ac76ec81?auto=format&fit=crop&w=600&q=80" // 復古傳統老街燈光照
            },
            "4": { 
                name: "潛園遺址", coords: [24.8027, 120.9622], item: "文人墨寶詩集", desc: "優雅的江南園林風格，隱約傳出古琴與吟詩聲。", 
                story: "雖然歷史上著名的潛園落成還要再等幾年，但此時全台首富林家已經在這邊購地，你走在圍牆外，能看到工匠們正在搬運太湖石。",
                img: "https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=600&q=80" // 中式白牆黑瓦竹林庭園照
            },
            "5": { 
                name: "長和宮（外媽祖）", coords: [24.8062, 120.9634], item: "媽祖平安符", desc: "郊商雲集的信仰中心，保佑著討海人與往來客商。", 
                story: "因為蓋在北門外，所以被稱為「外媽祖」。這時候的長和宮不僅是拜拜的地方，更是竹塹城最大的商業公會總部。",
                img: "https://images.unsplash.com/photo-1628155930542-3c7a64e2c833?auto=format&fit=crop&w=600&q=80" // 紅色平安燈籠高掛照
            },
            "6": { 
                name: "隆恩圳水路", coords: [24.8080, 120.9730], item: "清澈的灌溉圳水", desc: "聽得到潺潺流水聲，是孕育竹塹農業的重要水源。", 
                story: "這裡是隆恩圳的分流。道光年間的新竹還是個農業社會，水權就是大家的命根子。這時的水極為清澈，甚至可以直接捧起來喝！",
                img: "https://images.unsplash.com/photo-1508873696983-2df519f0397e?auto=format&fit=crop&w=600&q=80" // 貫穿城市森林的小溪流圳道照
            },
            "7": { 
                name: "進士第", coords: [24.8058, 120.9641], item: "開台進士紀念牌", desc: "「開台進士」鄭用錫的宅邸，門額上的「進士第」匾額威風顯赫。", 
                story: "鄭用錫在道光三年考中進士，是「台灣歷史上第一位在地進士」。他剛主導完竹塹城的築城工程，大宅邸門口正立著高高的旗杆。",
                img: "https://images.unsplash.com/photo-1599940824399-b87987ceb72a?auto=format&fit=crop&w=600&q=80" // 古代木造牌匾建築特寫照
            },
            "8": { 
                name: "楊氏節孝坊", coords: [24.8051, 120.9652], item: "石雕麒麟拓印", desc: "北門街附近剛落成幾年的精美石坊，青斗石與泉州白石交錯。", 
                story: "這座牌坊是在道光四年為了表彰節婦楊居娘而設立的。此時它在陽光下顯得極新，牌坊上的石雕麒麟栩栩如生，手工精細。",
                img: "https://images.unsplash.com/photo-1582268611958-ebfd161ef9cf?auto=format&fit=crop&w=600&q=80" // 精細雕刻的傳統歷史石坊照
            },
            "9": { 
                name: "暗街仔（中央路）", coords: [24.8041, 120.9678], item: "清代手工竹編籃", desc: "竹塹城最早發展的市集之一，街道狹窄不見天日。", 
                story: "因為兩邊的店家把屋簷蓋得太近，幾乎把天空都遮住了，所以即使是大白天走在裡面也像晚上。這裡充滿了打鐵聲與叫賣聲。",
                img: "https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=600&q=80" // 傳統編織、竹籐工藝品意境照
            },
            "10": { 
                name: "西門城遺址", coords: [24.8015, 120.9630], item: "守城士兵的舊頭盔", desc: "通往外坪與香山方向的西大門，城牆厚實。", 
                story: "相較於熱鬧的東門，西門顯得比較嚴肅。因為城門外連接的是香山一帶，常常有外地武裝流民或盜匪出沒。城門上的守兵正警惕地檢查行人。",
                img: "https://images.unsplash.com/photo-1599707367072-cd6ada2bc375?auto=format&fit=crop&w=600&q=80" // 莊嚴高聳的古代磚石城牆守衛照
            }
        };

        const CHANCE_EVENTS = [
            { text: "突然颳起一陣猛烈的【新竹九降風】！你差點被吹飛，舉步維艱。", change: -15 },
            { text: "在路邊遇到熱心的挑夫，載你一程並請你喝了奉茶。", change: 10 },
            { text: "走在泥濘的竹塹古道上，不小心跌了一跤！", change: -10 },
            { text: "路過市集，熱情的店家看你穿著奇特，送了你一個水煮番薯充飢。", change: 15 }
        ];

        let stamina = 100;
        let inventory = new Set();
        let visited = new Set();
        let markers = {};
        let currentId = null;

        // 1. 初始化地圖（精準定位至新竹舊城區中心點迎曦門）
        const map = L.map('map', { zoomControl: true }).setView([24.8039, 120.9714], 16);
        
        // 2. 連線至 OpenStreetMap 真實世界瓦片伺服器，渲染高精細度真實街道地圖
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).add_to(map);

        // 3. 在地圖上布置 10 個據點的真實位置標記
        for (let id in LOCATIONS) {
            let loc = LOCATIONS[id];
            
            // 自訂 CSS 大頭針，既美麗又 100% 不會被 Safari 阻擋
            let customIcon = L.divIcon({
                className: 'custom-pin',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            let marker = L.marker(loc.coords, { icon: customIcon }).addTo(map);
            marker.bindTooltip(loc.name, { permanent: false, direction: 'top' });
            
            // 監聽點擊事件
            marker.on('click', function() {
                goToLocation(id);
            });
            
            markers[id] = marker;
        }

        // 4. 玩家移動與核心遊戲邏輯
        function goToLocation(id) {
            if (id === currentId && visited.has(id)) return;
            let loc = LOCATIONS[id];
            
            let cost = Math.floor(Math.random() * 8) + 15;
            stamina -= cost;
            let logText = `🏃‍♂️ 你趕路前往【${loc.name}】，消耗體力 ${cost} 點。`;

            let isNew = !visited.has(id);
            if (isNew) {
                visited.add(id);
                inventory.add(loc.item);
            }
            
            currentId = id;
            map.panTo(loc.coords); // 地圖鏡頭平滑移過去

            let eventText = "";
            if (stamina > 0 && inventory.size < 5 && Math.random() < 0.60) {
                let event = CHANCE_EVENTS[Math.floor(Math.random() * CHANCE_EVENTS.length)];
                stamina += event.change;
                if (stamina > 100) stamina = 100;
                eventText = `<br>🎲【機會命運】${event.text} (${event.change > 0 ? '+' : ''}${event.change} 體力)`;
            }

            // 更新左邊控制台 UI 與更新地圖標記樣式
            updateUI(id, loc.name, loc.story, loc.item, logText, eventText);
            updateMarkerStyles();

            setTimeout(() => {
                if (inventory.size >= 5) {
                    endGame(true, `🎉 時空傳送成功！<br><br>你成功收集齊全 5 個歷史物資，時空盒共鳴發光，你順利回到了 2026 年的新竹東門城圓環！`);
                } else if (stamina <= 0) {
                    endGame(false,
